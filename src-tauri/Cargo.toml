[package]
name = "trellis-card"
version = "0.1.5"
description = "Read-only desktop observer for Trellis tasks and Agent activity"
edition = "2021"

[lib]
name = "trellis_card_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml_edit = "0.20.2"
dirs = "6"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
notify = "8"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Pipes", "Win32_Security"] }
